      modified: "2026-09-11T11:02:11.928Z"
      abstract: "Riflessione sul doppio richiamo a winrar nel corso della catena di attacco"
      content: >-
       Il fatto che WinRAR venga sia ottenuto tramite Evernote.zip nelle prime fasi, 
       sia riscaricato nella fase finale da MATCHBOIL, qualora non già presente in ProgramFiles,
       mi fa pensare che la catena di attacco sia stata perfezionata e, quindi, non si tratti 
       della sua prima versione. Ciò può significare che precedenti tentativi non fossero andati 
       a buon fine, oppure che la TTP fosse stata scoperta e si è reso necessario cambiare metodo.
      created_by_ref: id_3
      object_refs: [f_17, f_17a, to_1, ma_1, ma_4]
