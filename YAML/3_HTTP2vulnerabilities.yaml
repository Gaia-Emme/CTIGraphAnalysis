  vulnerability:
    - ref_id: vu_1
      spec_version: '2.1'
      id: vulnerability--0f785f67-87fd-4501-94ab-3cea0956709f
      created: '2026-08-01T09:23:00.172418Z'
      modified: '2026-08-02T09:23:00.172418Z'
      name: HTTP/2 flow-control causing OOM
      description: >-
        A remote, unauthenticated attacker could exploit HTTP/2 flow-control by
        setting SETTINGS_INITIAL_WINDOW_SIZE to 0 or withholding WINDOW_UPDATE
        frames, causing the server to buffer complete response bodies in memory
        indefinitely for stalled streams.
      external_references:
        - source_name: cve
          url: 'https://www.cve.org/CVERecord?id=CVE-2026-44909'
          external_id: CVE-2026-44909
        - source_name: cvss
          description: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H'
